services:
  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: techfeed
      POSTGRES_PASSWORD: techfeed
      POSTGRES_DB: techfeed
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techfeed"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
